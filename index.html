<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Denin Family Chart</title>
  <script src="https://unpkg.com/d3@7"></script>
  <script type="module" src="https://unpkg.com/family-chart@0.9.0"></script>
  <link rel="stylesheet" href="https://unpkg.com/family-chart@0.9.0/dist/styles/family-chart.css">
  <style>
    body { font-family: 'Arial', sans-serif; margin: 0; padding: 0; }

    /* ── Loading overlay ── */
    #loading-overlay {
      position: fixed; inset: 0;
      background: rgb(33,33,33);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 9999; gap: 16px;
      color: #fff; font-size: 15px; letter-spacing: 0.05em;
    }
    .spinner {
      width: 42px; height: 42px;
      border: 3px solid rgba(255,255,255,0.15);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Error box ── */
    #error-box {
      display: none;
      color: #ff6b6b; padding: 40px;
      font-family: monospace; font-size: 14px;
      line-height: 1.7; background: rgb(33,33,33);
      min-height: 100vh;
    }
  </style>
</head>
<body>

<!-- Loading state -->
<div id="loading-overlay">
  <div class="spinner"></div>
  <span>Loading family data…</span>
</div>

<!-- Error state -->
<div id="error-box"></div>

<!-- Chart -->
<div id="FamilyChart" class="f3"
     style="width:100%;height:100vh;margin:auto;background-color:rgb(33,33,33);color:#fff;display:none;">
</div>

<script type="module">

// ══════════════════════════════════════════════════════════
//  ⚙️  SUPABASE CONFIG — replace with your own values
// ══════════════════════════════════════════════════════════
const SUPABASE_URL    = 'https://esnnniiukcncralgssxl.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVzbm5uaWl1a2NuY3JhbGdzc3hsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ3NzQ0NjcsImV4cCI6MjA5MDM1MDQ2N30.raAsZS9TYYhtPA8BTu20puy_xO-F-fWm3gE4MayBcIo';
const TABLE_NAME      = 'family_members2';   // must match the table you create
// ══════════════════════════════════════════════════════════

// ── Supabase REST helper (no SDK needed) ──────────────────
async function fetchFromSupabase() {
  const url = `${SUPABASE_URL}/rest/v1/${TABLE_NAME}?select=*`;
  const res = await fetch(url, {
    headers: {
      'apikey':        SUPABASE_ANON_KEY,
      'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
      'Content-Type':  'application/json',
    }
  });
  if (!res.ok) {
    const body = await res.text();
    throw new Error(`Supabase error ${res.status}: ${body}`);
  }
  return res.json();   // returns array of row objects
}

// ── CSV pipe-string → array ───────────────────────────────
function splitPipe(val) {
  if (!val || val === '' || val === '0') return [];
  return val.split('|').filter(v => v && v !== '0');
}

// ── Transform flat Supabase rows → family-chart JSON ─────
function rowsToChartData(rows) {
  return rows.map(row => ({
    id: String(row.id),
    data: {
      'first name': row.first_name  ?? '',
      'last name':  row.last_name   ?? '',
      birthday:     row.birthday    ? String(row.birthday) : '',
      gender:       row.gender      ?? '',
      avatar:       row.avatar      ?? '',
    },
    rels: {
      // parents is stored as pipe-separated UUIDs e.g. "uuid1|uuid2"
      father: splitPipe(row.parents)[0] ?? null,
      mother: splitPipe(row.parents)[1] ?? null,
      // spouses → first spouse (family-chart uses spouses array)
      spouses: splitPipe(row.spouses),
      children: splitPipe(row.children),
    }
  }));
}

// ── Render the chart ──────────────────────────────────────
function create(data) {
  document.getElementById('loading-overlay').style.display = 'none';
  document.getElementById('FamilyChart').style.display     = 'block';

  const f3Chart = f3.createChart('#FamilyChart', data)
    .setTransitionTime(1000)
    .setCardXSpacing(250)
    .setCardYSpacing(150)
    .setSingleParentEmptyCard(true, {label: 'ADD'})
    .setShowSiblingsOfMain(true)
    .setOrientationVertical()
    .setDuplicateBranchToggle(true);

  const f3Card = f3Chart.setCardHtml()
    .setCardDisplay([["first name","last name"],["birthday"]])
    .setCardDim({})
    .setMiniTree(true)
    .setStyle('imageRect')
    .setOnHoverPathToMain();

  const f3EditTree = f3Chart.editTree()
    .fixed(true)
    .setFields(["first name","last name","birthday","avatar"])
    .setEditFirst(true)
    .setCardClickOpen(f3Card);

  f3EditTree.setEdit();
  f3Chart.updateTree({initial: true});
  f3EditTree.open(f3Chart.getMainDatum());
  f3Chart.updateTree({initial: true});
}

// ── Error display ─────────────────────────────────────────
function showError(msg) {
  document.getElementById('loading-overlay').style.display = 'none';
  const box = document.getElementById('error-box');
  box.style.display = 'block';
  box.innerHTML = `
    <h3 style="color:#ff6b6b;margin-top:0">⚠️ Could not load family data</h3>
    <pre style="white-space:pre-wrap;word-break:break-word;">${msg}</pre>
    <br>
    <strong>Checklist:</strong><br>
    1. Did you replace <code>SUPABASE_URL</code> and <code>SUPABASE_ANON_KEY</code> in this file?<br>
    2. Is the table named <code>${TABLE_NAME}</code> and set to <strong>public read</strong> in Supabase RLS?<br>
    3. Open the browser console (F12) for more details.
  `;
}

// ── Bootstrap ─────────────────────────────────────────────
fetchFromSupabase()
  .then(rows => {
    if (!rows.length) throw new Error('Table is empty — import your CSV first.');
    const chartData = rowsToChartData(rows);
    create(chartData);
  })
  .catch(err => {
    console.error(err);
    showError(err.message);
  });

</script>
</body>
</html>
