<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Denin Family Chart</title>
  <script src="https://unpkg.com/d3@7"></script>
  <script type="module" src="https://unpkg.com/family-chart@0.9.0"></script>
  <link rel="stylesheet" href="https://unpkg.com/family-chart@0.9.0/dist/styles/family-chart.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Fraunces:ital,opsz,wght@0,9..144,300;1,9..144,300&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'DM Mono', monospace; background: rgb(33,33,33); color: #fff; overflow: hidden; }

    /* ── Loading overlay ── */
    #loading-overlay {
      position: fixed; inset: 0;
      background: rgb(33,33,33);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 9999; gap: 16px;
      color: #fff; font-size: 13px; letter-spacing: 0.12em;
      font-family: 'DM Mono', monospace;
    }
    .spinner {
      width: 38px; height: 38px;
      border: 2px solid rgba(255,255,255,0.1);
      border-top-color: rgba(255,255,255,0.7);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Error box ── */
    #error-box {
      display: none;
      color: #ff6b6b; padding: 40px;
      font-family: 'DM Mono', monospace; font-size: 13px;
      line-height: 1.8; background: rgb(33,33,33);
      min-height: 100vh;
    }

    /* ── Chart wrapper ── */
    #FamilyChart {
      width: 100%; height: 100vh;
      background-color: rgb(33,33,33);
      display: none;
    }

    /* ══════════════════════════════════════
       SEARCH BAR
    ══════════════════════════════════════ */
    #search-container {
      position: fixed;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      width: min(480px, calc(100vw - 32px));
    }

    #search-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    #search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      color: rgba(255,255,255,0.35);
      display: flex;
      align-items: center;
    }

    #search-input {
      width: 100%;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px;
      color: #fff;
      font-family: 'DM Mono', monospace;
      font-size: 13px;
      letter-spacing: 0.04em;
      padding: 11px 40px 11px 40px;
      outline: none;
      transition: background 0.2s, border-color 0.2s, box-shadow 0.2s;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    #search-input::placeholder {
      color: rgba(255,255,255,0.28);
      font-style: italic;
    }
    #search-input:focus {
      background: rgba(255,255,255,0.11);
      border-color: rgba(255,255,255,0.3);
      box-shadow: 0 0 0 3px rgba(255,255,255,0.05), 0 8px 32px rgba(0,0,0,0.4);
    }

    /* clear button */
    #search-clear {
      position: absolute;
      right: 12px;
      top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer;
      color: rgba(255,255,255,0.35);
      display: none;
      align-items: center; justify-content: center;
      padding: 2px;
      transition: color 0.15s;
      line-height: 0;
    }
    #search-clear:hover { color: rgba(255,255,255,0.75); }
    #search-clear.visible { display: flex; }

    /* ── Dropdown results ── */
    #search-results {
      position: absolute;
      top: calc(100% + 8px);
      left: 0; right: 0;
      background: rgb(42,42,42);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 16px 48px rgba(0,0,0,0.6);
      display: none;
      max-height: 320px;
      overflow-y: auto;
    }
    #search-results.open { display: block; }

    .search-result-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 16px;
      cursor: pointer;
      transition: background 0.12s;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .search-result-item:last-child { border-bottom: none; }
    .search-result-item:hover,
    .search-result-item.active { background: rgba(255,255,255,0.07); }

    .result-avatar {
      width: 34px; height: 34px;
      border-radius: 50%;
      background: rgba(255,255,255,0.1);
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; color: rgba(255,255,255,0.5);
      overflow: hidden;
    }
    .result-avatar img { width: 100%; height: 100%; object-fit: cover; }

    .result-name {
      font-size: 13px;
      color: #fff;
      letter-spacing: 0.03em;
      line-height: 1.3;
    }
    .result-name em {
      font-style: normal;
      color: #f0c060;
    }
    .result-sub {
      font-size: 11px;
      color: rgba(255,255,255,0.38);
      margin-top: 1px;
      letter-spacing: 0.04em;
    }

    .search-no-results {
      padding: 18px 16px;
      font-size: 12px;
      color: rgba(255,255,255,0.3);
      text-align: center;
      letter-spacing: 0.08em;
      font-style: italic;
    }

    /* ── Toast notification ── */
    #search-toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: rgba(50,50,50,0.95);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 8px;
      padding: 10px 20px;
      font-size: 12px;
      letter-spacing: 0.07em;
      color: rgba(255,255,255,0.75);
      backdrop-filter: blur(12px);
      transition: transform 0.35s cubic-bezier(.22,1,.36,1), opacity 0.35s;
      opacity: 0;
      z-index: 1001;
      pointer-events: none;
    }
    #search-toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* scroll thin */
    #search-results::-webkit-scrollbar { width: 4px; }
    #search-results::-webkit-scrollbar-track { background: transparent; }
    #search-results::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 4px; }
  </style>
</head>
<body>

<!-- Loading state -->
<div id="loading-overlay">
  <div class="spinner"></div>
  <span>Loading family data…</span>
</div>

<!-- Error state -->
<div id="error-box"></div>

<!-- ══ Search bar ══ -->
<div id="search-container" style="display:none;">
  <div id="search-wrap">
    <span id="search-icon">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
        <circle cx="6.5" cy="6.5" r="5" stroke="currentColor" stroke-width="1.5"/>
        <path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </span>
    <input
      id="search-input"
      type="text"
      placeholder="Search family member…"
      autocomplete="off"
      spellcheck="false"
    />
    <button id="search-clear" title="Clear">
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
        <path d="M1 1l10 10M11 1L1 11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </button>
  </div>
  <div id="search-results"></div>
</div>

<!-- Toast -->
<div id="search-toast"></div>

<!-- Chart -->
<div id="FamilyChart" class="f3"
     style="width:100%;height:100vh;margin:auto;background-color:rgb(33,33,33);color:#fff;display:none;">
</div>

<script type="module">

// ══════════════════════════════════════════════════════════
//  ⚙️  SUPABASE CONFIG — replace with your own values
// ══════════════════════════════════════════════════════════
const SUPABASE_URL     = 'https://esnnniiukcncralgssxl.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_atkQZKMKVaDU_m9V3d_NuA_jcuI8S5x';
const TABLE_NAME       = 'family_members';
// ══════════════════════════════════════════════════════════

async function fetchFromSupabase() {
  const url = `${SUPABASE_URL}/rest/v1/${TABLE_NAME}?select=*`;
  const res = await fetch(url, {
    headers: {
      'apikey':        SUPABASE_ANON_KEY,
      'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
      'Content-Type':  'application/json',
    }
  });
  if (!res.ok) {
    const body = await res.text();
    throw new Error(`Supabase error ${res.status}: ${body}`);
  }
  return res.json();
}

function splitPipe(val) {
  if (!val || val === '' || val === '0') return [];
  return val.split('|').filter(v => v && v !== '0');
}

function rowsToChartData(rows) {
  return rows.map(row => ({
    id: String(row.id),
    data: {
      'first name': row.first_name  ?? '',
      'last name':  row.last_name   ?? '',
      birthday:     row.birthday    ? String(row.birthday) : '',
      gender:       row.gender      ?? '',
      avatar:       row.avatar      ?? '',
    },
    rels: {
      father:   splitPipe(row.parents)[0] ?? null,
      mother:   splitPipe(row.parents)[1] ?? null,
      spouses:  splitPipe(row.spouses),
      children: splitPipe(row.children),
    }
  }));
}

// ════════════════════════════════════════
//  Search feature
// ════════════════════════════════════════
let chartInstance  = null;
let chartData      = [];
let activeIndex    = -1;
let toastTimer     = null;

const searchInput   = document.getElementById('search-input');
const searchResults = document.getElementById('search-results');
const searchClear   = document.getElementById('search-clear');
const searchToast   = document.getElementById('search-toast');

function highlight(text, query) {
  if (!query) return text;
  const escaped = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return text.replace(new RegExp(`(${escaped})`, 'gi'), '<em>$1</em>');
}

function showToast(msg) {
  clearTimeout(toastTimer);
  searchToast.textContent = msg;
  searchToast.classList.add('show');
  toastTimer = setTimeout(() => searchToast.classList.remove('show'), 2800);
}

function getFullName(d) {
  return `${d.data['first name'] ?? ''} ${d.data['last name'] ?? ''}`.trim();
}

function renderResults(query) {
  const q = query.trim().toLowerCase();
  searchResults.innerHTML = '';
  activeIndex = -1;

  if (!q) {
    searchResults.classList.remove('open');
    return;
  }

  const matches = chartData.filter(d => {
    const name = getFullName(d).toLowerCase();
    const bday = (d.data.birthday ?? '').toLowerCase();
    return name.includes(q) || bday.includes(q);
  }).slice(0, 8);

  if (!matches.length) {
    searchResults.innerHTML = `<div class="search-no-results">No members found for "${query}"</div>`;
    searchResults.classList.add('open');
    return;
  }

  matches.forEach((d, i) => {
    const fullName   = getFullName(d);
    const hiName     = highlight(fullName, query.trim());
    const bday       = d.data.birthday ? `b. ${d.data.birthday}` : '';
    const avatar     = d.data.avatar;
    const initials   = (d.data['first name']?.[0] ?? '') + (d.data['last name']?.[0] ?? '');

    const item = document.createElement('div');
    item.className = 'search-result-item';
    item.dataset.id = d.id;
    item.innerHTML = `
      <div class="result-avatar">
        ${avatar
          ? `<img src="${avatar}" alt="${fullName}" onerror="this.parentNode.innerHTML='${initials}'">`
          : initials || '?'}
      </div>
      <div>
        <div class="result-name">${hiName}</div>
        ${bday ? `<div class="result-sub">${bday}</div>` : ''}
      </div>
    `;
    item.addEventListener('mousedown', (e) => {
      e.preventDefault(); // keep input focused
      selectMember(d);
    });
    searchResults.appendChild(item);
  });

  searchResults.classList.add('open');
}

function setActiveItem(index) {
  const items = searchResults.querySelectorAll('.search-result-item');
  items.forEach((el, i) => el.classList.toggle('active', i === index));
  activeIndex = index;
  if (items[index]) items[index].scrollIntoView({ block: 'nearest' });
}

function selectMember(d) {
  closeResults();
  searchInput.value = getFullName(d);
  searchClear.classList.add('visible');

  if (!chartInstance) return;
  try {
    chartInstance.updateMainId(d.id);
    chartInstance.updateTree({ initial: false });
    showToast(`Navigated to ${getFullName(d)}`);
  } catch (err) {
    console.warn('Could not navigate to member:', err);
    showToast(`Found: ${getFullName(d)}`);
  }
}

function closeResults() {
  searchResults.classList.remove('open');
  activeIndex = -1;
}

// Input events
searchInput.addEventListener('input', (e) => {
  const val = e.target.value;
  searchClear.classList.toggle('visible', val.length > 0);
  renderResults(val);
});

searchInput.addEventListener('keydown', (e) => {
  const items = searchResults.querySelectorAll('.search-result-item');
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    setActiveItem(Math.min(activeIndex + 1, items.length - 1));
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    setActiveItem(Math.max(activeIndex - 1, 0));
  } else if (e.key === 'Enter') {
    e.preventDefault();
    if (activeIndex >= 0 && items[activeIndex]) {
      const id = items[activeIndex].dataset.id;
      const d  = chartData.find(x => x.id === id);
      if (d) selectMember(d);
    }
  } else if (e.key === 'Escape') {
    closeResults();
    searchInput.blur();
  }
});

searchInput.addEventListener('focus', () => {
  if (searchInput.value.trim()) renderResults(searchInput.value);
});

searchClear.addEventListener('click', () => {
  searchInput.value = '';
  searchClear.classList.remove('visible');
  closeResults();
  searchInput.focus();
});

// Close dropdown when clicking outside
document.addEventListener('mousedown', (e) => {
  if (!document.getElementById('search-container').contains(e.target)) {
    closeResults();
  }
});

// Keyboard shortcut: / or Ctrl+K to focus search
document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey && e.key === 'k') || (e.key === '/' && document.activeElement !== searchInput)) {
    e.preventDefault();
    searchInput.focus();
    searchInput.select();
  }
});

// ════════════════════════════════════════
//  Chart render
// ════════════════════════════════════════
function create(data) {
  chartData = data;

  document.getElementById('loading-overlay').style.display = 'none';
  document.getElementById('FamilyChart').style.display     = 'block';
  document.getElementById('search-container').style.display = 'block';

  const f3Chart = f3.createChart('#FamilyChart', data)
    .setTransitionTime(1000)
    .setCardXSpacing(250)
    .setCardYSpacing(150)
    .setSingleParentEmptyCard(true, {label: 'ADD'})
    .setShowSiblingsOfMain(true)
    .setOrientationVertical()
    .setDuplicateBranchToggle(true);

  chartInstance = f3Chart;

  const f3Card = f3Chart.setCardHtml()
    .setCardDisplay([["first name","last name"],["birthday"]])
    .setCardDim({})
    .setMiniTree(true)
    .setStyle('imageRect')
    .setOnHoverPathToMain();

  const f3EditTree = f3Chart.editTree()
    .fixed(true)
    .setFields(["first name","last name","birthday","avatar"])
    .setEditFirst(true)
    .setCardClickOpen(f3Card);

  f3EditTree.setEdit();
  f3Chart.updateTree({initial: true});
  f3EditTree.open(f3Chart.getMainDatum());
  f3Chart.updateTree({initial: true});
}

function showError(msg) {
  document.getElementById('loading-overlay').style.display = 'none';
  const box = document.getElementById('error-box');
  box.style.display = 'block';
  box.innerHTML = `
    <h3 style="color:#ff6b6b;margin-top:0">⚠️ Could not load family data</h3>
    <pre style="white-space:pre-wrap;word-break:break-word;">${msg}</pre>
    <br>
    <strong>Checklist:</strong><br>
    1. Did you replace <code>SUPABASE_URL</code> and <code>SUPABASE_ANON_KEY</code> in this file?<br>
    2. Is the table named <code>${TABLE_NAME}</code> and set to <strong>public read</strong> in Supabase RLS?<br>
    3. Open the browser console (F12) for more details.
  `;
}

fetchFromSupabase()
  .then(rows => {
    if (!rows.length) throw new Error('Table is empty — import your CSV first.');
    const chartData = rowsToChartData(rows);
    create(chartData);
  })
  .catch(err => {
    console.error(err);
    showError(err.message);
  });

</script>
</body>
</html>
